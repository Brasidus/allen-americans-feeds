name: Allen Americans Away ICS

on:
  # schedule: REMOVED 2026-10-08. This workflow is fired on time by the Cloudflare
  # scheduler Worker mlo-weekly-dispatch (table: mlo-weekly-dispatch/src/jobs.js in the
  # claude-workspace repo) via workflow_dispatch, because GitHub's own cron late-fired or
  # skipped slots. Do not add a schedule: back here; that would run the job twice.
  workflow_dispatch:

jobs:
  update-away-ics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate away-games ICS
        run: python update_allen_away_ics.py

      - name: Commit if changed
        run: |
          if git diff --quiet allen-americans-away.ics; then
            echo "No change to allen-americans-away.ics — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allen-americans-away.ics
          git commit -m "Update Allen Americans away-games ICS"
          git push
